# ============================================================
# HR Recruitment & Management System — Nginx Configuration
# Place this at /etc/nginx/sites-available/hr-system on EC2
# ============================================================

server {
    listen 80;
    server_name _; # Or replace with your domain name e.g. hr.yourdomain.com

    # Increase client body size for resume uploads
    client_max_body_size 20M;

    # 1. Serve Production React Frontend
    location / {
        root /home/ubuntu/app/frontend/build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy API Requests to Node.js Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Serve Local Resume Uploads
    location /uploads/ {
        alias /home/ubuntu/app/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
}
